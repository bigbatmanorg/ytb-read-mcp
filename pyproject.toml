[project]
name = "ytb-read-mcp"
version = "1.1.0"
description = "Local-first YouTube research MCP: discovery, transcripts, media and resumable jobs over stdio or HTTP"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{name = "bigbatmanorg"}]
keywords = ["mcp", "youtube", "yt-dlp", "transcripts", "stdio"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Operating System :: OS Independent", "Topic :: Multimedia :: Video"]
dependencies = [
  "fastmcp>=4.0.9,<5",
  "filelock>=3.16,<4",
  "httpx>=0.28,<1",
  "yt-dlp[default]>=2026.8.19",
  "deno>=2.9.8,<3",  # official Deno binary wheel; no separate JS runtime install on supported platforms
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.11,<1",
  "build>=1.2,<2",
]

[project.scripts]
ytb-read-mcp = "youtube_read_mcp.cli:main"
youtube-read-mcp = "youtube_read_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/bigbatmanorg/ytb-read-mcp"
Repository = "https://github.com/bigbatmanorg/ytb-read-mcp"
Issues = "https://github.com/bigbatmanorg/ytb-read-mcp/issues"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/youtube_read_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
